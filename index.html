<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mat Entiende</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <header>
            <img src="img/logomat.png" alt="Logo de Mat Entiende">
            <h1>Mat Entiende</h1>
        </header>

        <section class="bienvenida">
            <h2>Hola Juan, ¿Como estas?.</h2>
            <p>¿Qué vamos a resolver hoy?</p>
        </section>

        <form action="#" method="post">

            <fieldset>
                <legend>Tipo de operación</legend>

                <input type="radio" id="suma" name="operacion" value="suma">
                <label for="suma" class="operacion">
                    <span>＋</span>
                    <span>Suma</span>
                </label>

                <input type="radio" id="resta" name="operacion" value="resta">
                <label for="resta" class="operacion">
                    <span>−</span>
                    <span>Resta</span>
                </label>

                <input type="radio" id="multiplicacion" name="operacion" value="multiplicacion">
                <label for="multiplicacion" class="operacion">
                    <span>×</span>
                    <span>Multiplicación</span>
                </label>

                <input type="radio" id="division" name="operacion" value="division">
                <label for="division" class="operacion">
                    <span>÷</span>
                    <span>División</span>
                </label>

            </fieldset>

            <section class="numeros">

                <div>
                    <label for="numero1">Número 1</label>

                    <input
                        type="number"
                        id="numero1"
                        name="numero1"
                        value="0"
                    >
                </div>

                <div>
                    <label for="numero2">Número 2</label>

                    <input
                        type="number"
                        id="numero2"
                        name="numero2"
                        value="0"
                    >
                </div>

            </section>

            <div>
                <label for="fecha">Fecha de consulta</label>

                <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    value="2026-09-15"
                >
            </div>

            <button type="submit">
                ✓ Resolver ejercicio
            </button>

        </form>

    </main>

</body>

</html>
