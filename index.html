<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mat Entiende</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <section id="inicioSesion" class="pantalla">

        <div class="logo">
            <img src="img/logo-mat-entiende.png" alt="Logo Mat Entiende">
        </div>

        <div class="imagen-matematicas">
            <img src="img/matematicas.png" alt="Matemáticas">
        </div>

        <div class="formulario">

            <div class="opciones">
                <button type="button" onclick="mostrarInicio()">Iniciar sesión</button>
                <button type="button" onclick="mostrarRegistro()">Crear cuenta</button>
            </div>

            <h1>Iniciar sesión</h1>

            <p>Accede a tus clases y ejercicios</p>

            <form>

                <div class="campo">
                    <span>✉</span>
                    <input type="email" placeholder="Correo electrónico">
                </div>

                <div class="campo">
                    <span>🔒</span>
                    <input type="password" placeholder="Contraseña">
                </div>

                <button type="button" class="boton-principal" onclick="mostrarEjercicio()">
                    Iniciar sesión ➜
                </button>

            </form>

            <button type="button" class="enlace" onclick="mostrarRegistro()">
                ¿No tienes cuenta? Regístrate gratis
            </button>

        </div>

    </section>


    <section id="registro" class="pantalla oculto">

        <div class="logo">
            <img src="img/logo-mat-entiende.png" alt="Logo Mat Entiende">
        </div>

        <div class="imagen-matematicas">
            <img src="img/matematicas.png" alt="Matemáticas">
        </div>

        <div class="formulario">

            <div class="opciones">
                <button type="button" onclick="mostrarInicio()">Iniciar sesión</button>
                <button type="button" onclick="mostrarRegistro()">Crear cuenta</button>
            </div>

            <h1>Crear cuenta</h1>

            <p>Únete a nuestra comunidad de aprendizaje</p>

            <form>

                <div class="campo">
                    <span>♟</span>
                    <input type="text" placeholder="Nombre completo">
                </div>

                <div class="campo">
                    <span>✉</span>
                    <input type="email" placeholder="Correo electrónico">
                </div>

                <div class="campo">
                    <span>☎</span>
                    <input type="tel" placeholder="Teléfono">
                </div>

                <div class="campo">
                    <span>🔒</span>
                    <input type="password" placeholder="Contraseña">
                </div>

                <button type="button" class="boton-principal" onclick="mostrarInicio()">
                    Registrarse ♣
                </button>

            </form>

            <button type="button" class="enlace" onclick="mostrarInicio()">
                ¿Ya tienes cuenta? Inicia sesión
            </button>

        </div>

    </section>


    <section id="ejercicio" class="pantalla oculto">

        <header>

            <button type="button" aria-label="Volver">
                ←
            </button>

            <h1>Mat Entiende</h1>

            <img src="img/logo-mat-entiende.png" alt="Logo de Mat Entiende">

        </header>

        <main>

            <section class="saludo">

                <h2>Hola Mateo.</h2>

                <p>¿qué vamos a resolver hoy?</p>

            </section>

            <form>

                <fieldset>

                    <legend>Tipo de operación</legend>

                    <p class="indicacion">
                        Selecciona una operación e ingresa los números para comenzar.
                    </p>

                    <button type="button" name="operacion" value="suma">
                        <span>＋</span>
                        <span>Suma</span>
                    </button>

                    <button type="button" name="operacion" value="resta">
                        <span>−</span>
                        <span>Resta</span>
                    </button>

                    <button type="button" name="operacion" value="multiplicacion">
                        <span>×</span>
                        <span>Multiplicación</span>
                    </button>

                    <button type="button" name="operacion" value="division">
                        <span>÷</span>
                        <span>División</span>
                    </button>

                </fieldset>

                <section class="numeros">

                    <div>

                        <label for="numero1">Número 1</label>

                        <input
                            type="number"
                            id="numero1"
                            name="numero1"
                            placeholder="0"
                        >

                    </div>

                    <div>

                        <label for="numero2">Número 2</label>

                        <input
                            type="number"
                            id="numero2"
                            name="numero2"
                            placeholder="0"
                        >

                    </div>

                </section>

                <button type="submit" class="resolver">
                    ✓ Resolver ejercicio
                </button>

            </form>

        </main>

    </section>


    <script src="./script.js"></script>

</body>

</html>
